# CI/CD: on every push to main run typecheck + tests, then deploy to the Oracle VM.
# The image is built on the VM itself (arm64), see deploy/deploy.sh.
# Required repository secret: VC_SSH_KEY (private key authorized for opc@VM).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VC_HOST: opc@92.5.71.193
  # Public host key of the VM (ssh-keyscan -t ed25519 92.5.71.193)
  VC_KNOWN_HOST: "92.5.71.193 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOm9YuZyp7DzpDO3kB9qRn31aMWrfYLYKXrJfyucBJYP"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # mysql-memory-server needs libaio/libnuma to run the downloaded MySQL binaries
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libaio1t64 libnuma1
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SSH ključ
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VC_KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Deploy na VM
        run: bash deploy/deploy.sh
